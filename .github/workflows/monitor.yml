name: Public availability monitor (TEST scheduled trial)
run-name: TEST monitoring · ${{ inputs.trigger_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      confirm_test_delivery:
        description: Explicitly permits TEST notifications for a manual run
        type: boolean
        default: false
      telegram_transport_test:
        description: Send one TEST connectivity message only; no website or D1 mutation
        type: boolean
        default: false
      dispatch_source:
        description: Trigger metadata only; never enables booking
        type: choice
        options: [manual, cloudflare_cron]
        default: manual
      trigger_id:
        description: Optional non-secret trigger correlation ID
        type: string
        default: ''
  # Sole automatic trigger: Cloudflare bot-datsan-cron -> workflow_dispatch.
  # No native GitHub schedule; no second sender. Runtime still checks JST hours.
permissions:
  contents: read
concurrency:
  group: katsushika-public-monitor-test
  cancel-in-progress: false
jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_test_delivery }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - if: ${{ !inputs.telegram_transport_test }}
        run: python -m playwright install --with-deps chromium
      - name: Telegram transport TEST only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_transport_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_DESTINATION: TEST
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json, os, sys
          from monitor.shared.telegram import TelegramBotAdapter, TelegramDeliveryError, chat_id
          report = {"kind": "TELEGRAM_TRANSPORT_TEST_ONLY", "execution_allowed": False, "auto_booking_allowed": False}
          try:
              destination = chat_id(os.environ.get("TELEGRAM_TEST_CHAT_ID", ""))
              if os.environ.get("TELEGRAM_DESTINATION") != "TEST" or not destination.startswith("-"):
                  raise TelegramDeliveryError("INVALID_CHAT_ID")
              receipt = TelegramBotAdapter(os.environ.get("TELEGRAM_BOT_TOKEN"), enabled=True).send_message(
                  destination,
                  "[TEST — GITHUB ACTIONS → TELEGRAM]\nKHÔNG PHẢI THÔNG BÁO SÂN TRỐNG.\n"
                  "Kiểm tra đường truyền tới Group TEST; không quét website, không đặt sân, không thay đổi baseline.", [])
              report.update(status="SENT", message_id=receipt.message_id)
          except TelegramDeliveryError as error:
              report.update(status="UNCERTAIN" if error.ambiguous else "FAILED", reason=error.code)
          except Exception:
              report.update(status="UNCERTAIN", reason="TRANSPORT_TEST_STOPPED_NO_RETRY")
          print(json.dumps(report))
          sys.exit(0 if report["status"] == "SENT" else 2)
          PY
      - name: One-shot public scan and TEST delivery
        if: ${{ !inputs.telegram_transport_test }}
        env:
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL }}
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_DESTINATION: TEST
          PYTHONDONTWRITEBYTECODE: '1'
          DEBUG: ''
          PWDEBUG: ''
        run: python -m monitor.runtime --enable-test-delivery --baseline QUIET
